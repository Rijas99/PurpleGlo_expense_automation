services:
  - type: web
    name: purpleglo-expense
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /app/data/expenses.db
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GITHUB_BACKUP_REPO
        sync: false
      - key: GITHUB_BACKUP_TOKEN
        sync: false
