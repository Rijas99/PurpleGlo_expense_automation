<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · PurpleGlo</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-body">
  <form class="card login-card" method="post" action="/login">
    <div class="brand">
      <span class="mark">PG</span>
      <div><strong>PurpleGlo</strong><span>Expense Manager</span></div>
    </div>
    {% if flash %}<div class="flash {{ flash.kind }}">{{ flash.text }}</div>{% endif %}
    <label>Username
      <input type="text" name="username" autocomplete="username" autofocus required />
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <p class="hint">Username is the first name in lowercase, e.g. rijas</p>
    <button type="submit">Enter</button>
  </form>
</body>
</html>
